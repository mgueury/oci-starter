apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ##K8S_APP_PREFIX##-ui-route
{%- if tls == "new_http_01" %}
  annotations:
    # These remain controller-specific (not part of Gateway API)
    cert-manager.io/issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/hostname: ##TF_VAR_dn_name##
{%- endif %}
spec:
  parentRefs:
  - name: oke-gateway
    namespace: gateway    
{%- if tls == "new_http_01" %}
  hostnames:
  - "##TF_VAR_dn_name##"
{%- endif %}
  rules:
  - matches:
    - path:
        type: Exact
        value: /##K8S_APP_PREFIX##
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /##K8S_APP_PREFIX##/
        statusCode: 301
  - matches:
    - path:
        type: PathPrefix
        value: /##K8S_APP_PREFIX##
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: ##K8S_APP_PREFIX##-ui-service
      port: 80

