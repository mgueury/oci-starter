apiVersion: v1
kind: Pod
metadata:
  name: ##K8S_APP_PREFIX-ui
  labels:
    app: ##K8S_APP_PREFIX##-ui
spec:
  containers:
  - name: ##K8S_APP_PREFIX##-ui
    image: ##DOCKER_PREFIX##/##K8S_APP_PREFIX##-ui:##DOCKER_IMG_VERSION##
    ports:
      - containerPort: 80
        name: http-port
  imagePullSecrets:
  - name: ocirsecret        
---
apiVersion: v1
kind: Service
metadata:
  name: ##K8S_APP_PREFIX##-ui-service
spec:
  selector:
    app: ##K8S_APP_PREFIX##-ui
  ports:
  - name: http-service-port
    protocol: TCP
    port: 80
    targetPort: http-port
---    