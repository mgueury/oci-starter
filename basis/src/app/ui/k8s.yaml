apiVersion: apps/v1
kind: Deployment
metadata:
  name: ##TF_VAR_prefix##-ui-dep
  labels:
    app: ##TF_VAR_prefix##-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ##TF_VAR_prefix##-ui
  template:
    metadata:
      labels:
        app: ##TF_VAR_prefix##-ui
    spec:
      containers:
      - name: ##TF_VAR_prefix##-ui
        image: ##DOCKER_PREFIX##/##TF_VAR_prefix##-ui:##DOCKER_IMG_VERSION##
        ports:
        - containerPort: 80
          name: http-port
      imagePullSecrets:
      - name: ocirsecret
---
apiVersion: v1
kind: Service
metadata:
  name: ##TF_VAR_prefix##-ui-service
spec:
  selector:
    app: ##TF_VAR_prefix##-ui
  ports:
  - name: http-service-port
    protocol: TCP
    port: 80
    targetPort: http-port
---    
